<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ศูนย์ติดตามสถานี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --card:#ffffff; --ink:#1d2b2a; --muted:#6b7b79; --line:#e3e9e7;
  --teal:#2f8f7f; --teal-d:#246f63; --teal-l:#e3f2ef;
  --ok:#2f9e5b; --warn:#e0a21b; --bad:#d64541;
  --shadow:0 6px 24px rgba(30,60,55,.10), 0 1px 3px rgba(30,60,55,.08);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Sarabun',system-ui,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.num{font-family:'Chakra Petch',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:inherit}

/* top bar */
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:12px;align-items:stretch;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#brand{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 10px;min-width:0}
#brand .logo{width:44px;height:44px;border-radius:12px;background:var(--teal);display:grid;place-items:center;flex:none}
#brand b{display:block;font-size:17px;line-height:1.2;white-space:nowrap}
#brand small{color:var(--muted);font-size:12.5px;white-space:nowrap}
#brand small a{color:var(--teal-d)}
#search{flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;min-width:0;max-width:640px}
#search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:transparent;min-width:0;padding:14px 0}
#search .hint{color:var(--bad);font-size:12.5px;white-space:nowrap}
#btnPanels{display:none;padding:0 14px;border:0}

#clock{position:fixed;top:82px;right:12px;padding:10px 18px;display:flex;align-items:center;gap:12px;z-index:5}
#clock .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(47,158,91,.15)}
#clock .t{font-size:26px;font-weight:700;letter-spacing:.5px}
#clock .m{color:var(--muted);font-size:12.5px}

/* left column */
#left{position:fixed;top:82px;left:12px;width:min(560px,calc(100% - 24px));z-index:4}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:-8px;position:relative;z-index:0}
#tabs button{background:var(--card);border:0;border-radius:14px 14px 0 0;padding:9px 12px 16px;text-align:left;box-shadow:var(--shadow);min-width:0}
#tabs button span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button b{font-family:'Chakra Petch';font-size:19px}
#tabs button.on{background:var(--teal);color:#fff}
#tabs button.on span{color:#d8f0eb}
#replay{position:relative;z-index:1;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px}
.btn.on,.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:hover{border-color:var(--teal)}
#speeds .btn{padding:7px 10px;font-family:'Chakra Petch'}
#play{width:40px;background:#fff3d6;border-color:#f3d48a;color:#b07a00}
#tread{margin-left:auto;font-family:'Chakra Petch';font-weight:600;font-size:15px}
#spark{width:100%;height:46px;display:block;margin-top:10px}
#slider{width:100%;margin:0;accent-color:var(--teal);height:22px}
#foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:4px}
#legend{display:flex;gap:10px;flex-wrap:wrap}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}

/* map tools */
#tools{position:fixed;left:12px;top:50%;transform:translateY(-10%);display:flex;flex-direction:column;padding:6px;gap:2px;z-index:3}
#tools button{width:40px;height:40px;border:0;background:transparent;border-radius:10px;font-size:20px;display:grid;place-items:center}
#tools button:hover{background:var(--teal-l)}
#tools hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* right column */
#right{position:fixed;right:12px;top:150px;bottom:12px;width:350px;overflow:auto;display:flex;flex-direction:column;gap:12px;z-index:4;padding-bottom:2px;scrollbar-width:thin}
#right .card{padding:14px 16px}
#right h3{margin:0 0 10px;font-size:15.5px;display:flex;justify-content:space-between;align-items:baseline}
#right h3 small{font-weight:400;color:var(--muted);font-size:12px}
.svc{padding:7px 0;cursor:pointer}
.svc .l{display:flex;justify-content:space-between;gap:8px}
.svc .l b{font-weight:600}
.svc .l span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.bar{height:5px;border-radius:4px;background:#e8eeec;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.tr:first-of-type{border-top:0}
.tr .no{font-family:'Chakra Petch';font-weight:700;background:var(--teal-l);color:var(--teal-d);border-radius:8px;padding:3px 7px;min-width:44px;text-align:center}
.tr .nm{min-width:0}
.tr .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm small{color:var(--muted)}
.tr .st{font-size:12px;border-radius:20px;padding:3px 9px;white-space:nowrap}
.st.ok{background:#e4f5ea;color:#1f7a44}.st.warn{background:#fdf1d6;color:#9a6a00}.st.bad{background:#fbe3e2;color:#a8302c}.st.mut{background:#eef1f0;color:var(--muted)}.st.live{background:var(--teal);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:#f6f9f8;border-radius:12px;padding:9px 11px}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv b{font-family:'Chakra Petch';font-size:18px}
.kv em{font-style:normal;color:var(--muted);font-size:12px}
.sub{color:var(--muted);font-size:12.5px;margin:10px 0 6px;font-weight:600}

/* detail card */
#detail{position:fixed;left:12px;bottom:12px;width:min(470px,calc(100% - 24px));padding:16px 18px;z-index:6;display:none;max-height:calc(100% - 24px);overflow:auto}
#detail.show{display:block}
#detail .hd{display:flex;gap:14px;align-items:center}
#detail .badge{min-width:62px;height:56px;padding:0 10px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;font-size:21px}
#detail .ttl{flex:1;min-width:0}
#detail .ttl b{font-size:17px;display:block}
#detail .ttl small{color:var(--muted)}
#detail .x{border:0;background:#f1f4f3;border-radius:50%;width:30px;height:30px;flex:none}
#detail .chip{font-size:12.5px;border-radius:20px;padding:4px 10px;background:var(--teal-l);color:var(--teal-d);white-space:nowrap;font-weight:600}
.steps{display:flex;margin:16px 0 8px;position:relative}
.step{flex:1;text-align:center;position:relative;min-width:0}
.step:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:4px;background:#dfe7e5}
.step:first-child:before{display:none}
.step.done:before,.step.cur:before{background:var(--teal)}
.step i{position:relative;display:block;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:#fff;border:3px solid #cfdad7}
.step.done i{background:var(--teal);border-color:var(--teal)}
.step.cur i{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-l)}
.step span{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.step.cur span{color:var(--ink);font-weight:700}
.step em{display:block;font-style:normal;font-family:'Chakra Petch';font-size:12px;color:var(--muted)}
.info{margin:10px 0 0;line-height:1.75;font-size:13.5px}
.info b{font-weight:700}
.plist{margin-top:6px;border-top:1px solid var(--line)}
.plist div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.plist div:hover{color:var(--teal-d)}
.note{margin-top:10px;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  #right{display:none;top:auto;left:12px;right:12px;width:auto;max-height:62vh;bottom:12px;z-index:7}
  #right.open{display:flex}
  #btnPanels{display:block}
  #brand small{display:none}
  #brand b{font-size:15px}
  #clock{top:auto;bottom:12px;right:12px;padding:8px 12px}
  #clock .t{font-size:19px}
  #clock .m{display:none}
  #left{top:76px}
  #tools{top:auto;bottom:70px;transform:none}
  #detail{bottom:64px}
  #tabs button{padding:7px 8px 14px}
  #tabs button b{font-size:16px}
}
@media (max-width:520px){
  #brand .logo{width:36px;height:36px}
  #brand{padding:8px 10px 8px 8px}
  #brand b{white-space:normal;font-size:13.5px}
  #search{padding:0 10px}
  #search input{font-size:14px}
  #replay{padding:10px}
  #speeds .btn{padding:6px 7px}
  #spark{height:34px}
}
#left.min .ctrl,#left.min #spark,#left.min #ftxt,#left.min #legend{display:none}
#left.min #foot{justify-content:flex-end;margin-top:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div id="brand" class="card">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M9 20l-2 2M15 20l2 2M8.5 16v.01M15.5 16v.01"/></svg>
    </div>
    <div style="min-width:0"><b id="stName"></b><small><span id="stSub"></span> · <a href="index.html">ระบบรายงานเวลา</a></small></div>
  </div>
  <label id="search" class="card">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7b79" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="ค้นหาเลขคิว · เลขตั๋ว · เลขสินค้า · เลขขบวน (ไม่ต้องใส่ 0 นำหน้า)" autocomplete="off">
    <span class="hint" id="qhint"></span>
  </label>
  <button id="btnPanels" class="card">☰</button>
</div>

<div id="clock" class="card">
  <span class="dot" id="cdot"></span>
  <span class="t num" id="ctime">--:--</span>
  <span class="m" id="cmeta"></span>
</div>

<div id="left">
  <div id="tabs">
    <button data-mode="type" class="on"><span>ผู้โดยสารในสถานี</span><b id="tb1">0</b></button>
    <button data-mode="wait"><span>รอคิว · เฉลี่ย</span><b id="tb2">0</b></button>
    <button data-mode="heat"><span>ความหนาแน่น</span><b id="tb3">0%</b></button>
    <button data-mode="type2"><span>ออกเดินทางแล้ววันนี้</span><b id="tb4">0</b></button>
  </div>
  <div id="replay" class="card">
    <div class="row ctrl">
      <select id="dD" class="sel num"></select>
      <select id="dM" class="sel"></select>
      <select id="dY" class="sel num"></select>
      <button class="btn pri" id="bOpen">เปิดดู</button>
      <button class="btn" id="bYest">เมื่อวาน</button>
      <button class="btn" id="bLive">ข้อมูลสด</button>
    </div>
    <div class="row" style="margin-top:10px" id="speeds">
      <button class="btn" id="play">❚❚</button>
      <button class="btn" data-sp="1">×1</button>
      <button class="btn" data-sp="10">×10</button>
      <button class="btn" data-sp="30">×30</button>
      <button class="btn" data-sp="60">×60</button>
      <button class="btn" data-sp="120">×120</button>
      <button class="btn" data-sp="300">×300</button>
      <span id="tread">--:-- น. / 23:59 น.</span>
    </div>
    <canvas id="spark"></canvas>
    <input type="range" id="slider" min="0" max="1000" value="0">
    <div id="foot"><span id="ftxt"></span><span id="legend"></span><button class="btn" id="bMin" style="padding:3px 10px;font-size:12px">ย่อแผง</button></div>
  </div>
</div>

<div id="tools" class="card">
  <button id="zIn" title="ซูมเข้า">+</button>
  <button id="zOut" title="ซูมออก">−</button>
  <hr>
  <button id="rL" title="หมุนซ้าย">⟲</button>
  <button id="rR" title="หมุนขวา">⟳</button>
  <button id="home" title="มุมมองเริ่มต้น">⌂</button>
</div>

<div id="right">
  <div class="card"><h3>จุดบริการ <small id="svcNote"></small></h3><div id="svcList"></div></div>
  <div class="card"><h3>ขบวนรถ <small>ตามตารางเดินรถ</small></h3><div id="trList"></div></div>
  <div class="card"><h3>ตั๋ว & สินค้าวันนี้ <small id="sumT"></small></h3><div id="sum"></div></div>
</div>

<div id="detail" class="card"></div>

<script>
'use strict';
/* =====================================================================
   ศูนย์ติดตามสถานี: แผนผังสถานีแบบ isometric พร้อมย้อนดูทั้งวัน
   ข้อมูลทั้งหมดในหน้านี้เป็น "ข้อมูลจำลอง" ที่สร้างจากวันที่ (สุ่มแบบคงที่ต่อวัน)
   แก้ชื่อสถานี / ตารางเดินรถ / จำนวนช่องบริการ ได้ที่ STATION, TIMETABLE, ZONES
   ===================================================================== */

const STATION = { name:'สถานีรถไฟตันหยงมัส', sub:'ยม. · อ.ระแงะ จ.นราธิวาส · สายใต้', here:'ตันหยงมัส' };
const OPEN = 5*3600, CLOSE = 20*3600;

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const pad = (n,l=2) => String(n).padStart(l,'0');
const hhmm = s => { s = Math.max(0, Math.round(s)); const d = Math.floor(s/86400); s %= 86400;
  return (d ? 'พรุ่งนี้ ' : '') + pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s/60)%60); };
const fmtN = n => Math.round(n).toLocaleString('th-TH');
const TH_M = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const thDate = d => `วัน${TH_D[d.getDay()]}ที่ ${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear()+543}`;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const tm = s => { const [h,m] = s.split(':').map(Number); return h*3600 + m*60; };
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const rr = (a,b) => a + R()*(b-a);
const ri = (a,b) => Math.floor(rr(a, b+1));
const pick = a => a[Math.floor(R()*a.length)];
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
const norm = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/(^|[A-Z])0+(?=\d)/g,'$1');

class Heap{
  constructor(){ this.a = []; }
  get size(){ return this.a.length; }
  push(x){ const a = this.a; a.push(x); let i = a.length-1;
    while(i > 0){ const p = (i-1) >> 1; if(a[p].t <= x.t) break; a[i] = a[p]; i = p; } a[i] = x; }
  pop(){ const a = this.a; if(!a.length) return null; const top = a[0], last = a.pop();
    if(a.length){ let i = 0; const n = a.length;
      for(;;){ const l = 2*i+1, r = l+1; let m = -1, mt = last.t;
        if(l < n && a[l].t < mt){ m = l; mt = a[l].t; }
        if(r < n && a[r].t < mt){ m = r; }
        if(m < 0) break; a[i] = a[m]; i = m; }
      a[i] = last; }
    return top; }
}

/* ---------------- ผังสถานีตันหยงมัส (หน่วยเมตร: x ไปตามแนวราง, y ไปทางลานหน้าสถานี) ----------------
   ชานชาลา/รางอยู่ด้านบน (y น้อย) · อาคารสถานียาวขนานราง · ลานจอดรถและวงเวียนอยู่ด้านหน้า (y มาก)
   ห้องในอาคารเรียงจากซ้าย: ห้องน้ำ · ห้องสินค้า · ห้องนายสถานี · ห้องจำหน่ายตั๋ว · ห้องพักผู้โดยสาร · ร้านสะดวกซื้อ */
const N = {
  street:[52,50], door:[52,30.8], hall_c:[52,26.2], tick_in:[42.6,24.5], hall_n:[52,19], shop_in:[61.4,24.2],
  p1_w:[15,16.6], p1_m:[52,16.6], p1_c:[56,16.6], p1_e:[70,16.6],
  p2_w:[15,9.2], p2_c:[56,9.2], p2_e:[70,9.2],
  goods_out:[17,31], goods_in:[17,28.4],
};
const EDGES = [
  ['street','door'],['door','hall_c'],['hall_c','tick_in'],['hall_c','hall_n'],['hall_n','p1_m'],['hall_c','shop_in'],
  ['p1_w','p1_m'],['p1_m','p1_c'],['p1_c','p1_e'],['p1_w','p2_w'],['p1_c','p2_c'],['p2_w','p2_c'],['p2_c','p2_e'],
  ['street','goods_out'],['goods_out','goods_in'],
];
const ADJ = {}; for(const k in N) ADJ[k] = [];
for(const [a,b] of EDGES){ const d = dist(N[a],N[b]); ADJ[a].push([b,d]); ADJ[b].push([a,d]); }
const routeCache = {};
function route(a,b){
  const key = a+'>'+b; if(routeCache[key]) return routeCache[key];
  const D = {}, P = {}, done = {}; for(const k in N) D[k] = Infinity; D[a] = 0;
  for(;;){ let u = null; for(const k in N) if(!done[k] && D[k] < Infinity && (u === null || D[k] < D[u])) u = k;
    if(u === null || u === b) break; done[u] = 1;
    for(const [v,w] of ADJ[u]) if(D[u]+w < D[v]){ D[v] = D[u]+w; P[v] = u; } }
  if(D[b] === Infinity) return routeCache[key] = [N[b]];
  const out = []; for(let k = b; k; k = P[k]) out.unshift(N[k]);
  return routeCache[key] = out;
}

const H_OPEN = (a,b) => t => (t >= a*3600 && t < b*3600);
// จุดบริการ: srv = จุดที่ลูกค้ายืนรับบริการ, desks = เคาน์เตอร์ [x0,y0,x1,y1], staff = ตำแหน่งเจ้าหน้าที่
const ZONES = {
  ticket:{ name:'ช่องจำหน่ายตั๋ว (2 ช่อง)', prefix:'T', rect:[38,19.4,45.4,29.6], floor:'#e3f2ef', entry:'tick_in',

let sim = null;

function buildDay(date){
  const seed = date.getFullYear()*10000 + (date.getMonth()+1)*100 + date.getDate();
  R = mulberry32(seed * 2654435761 >>> 0);
  const dow = date.getDay();
  const dayF = (dow === 0 || dow === 5 || dow === 6) ? 1.25 : 1;
  const S = { date, trains:[], agents:[], parcels:[], ev:{}, waits:[], srv:{}, qn:{}, seq:{tk:0,snd:0,rcv:0} };
  for(const k of ['saleCounter','online','booking','shop','parcelIn','parcelShip','parcelArr','parcelPick','board','alight']) S.ev[k] = [];
  for(const k in ZONES) S.srv[k] = ZONES[k].srv.map(() => 0);

  // ที่นั่ง: ห้องพักผู้โดยสาร + ม้านั่งบนชานชาลา 1
  S.seats = [];
  for(const y of [20.6, 21.4, 23.8, 24.6, 27, 27.8]) for(let x = 46.3; x <= 59.4; x += 0.75){
    if(x > 50.6 && x < 53.4) continue;
    S.seats.push({ x, y, back: [20.6, 23.8, 27].includes(y) ? -1 : 1, area:'hall', iv:[] });
  }
  for(let x = 26; x <= 66; x += 0.75){ if(Math.floor((x - 26) / 3.75) % 2) continue;
    S.seats.push({ x, y:17.35, back:1, area:'plat1', iv:[] }); }
  // ช่องวางสินค้าในห้องเก็บ
  S.slots = [];
  for(let y = 18.9; y <= 24.4; y += 0.8) for(let x = 11; x <= 23.2; x += 0.8){
    if(x > 15.8 && x < 18.4) continue;
    S.slots.push({ x, y, iv:[] });
  }

  // ขบวนรถ + ความล่าช้า
  const trains = TIMETABLE.map(([no,type,from,to,arr,dep,dir,stops]) => {
    const T = TYPES[type];
    if(arr && !dep && stops.length) dep = hhmm(tm(arr) + 60);   // ข้อมูลไม่มีเวลาออก แต่ขบวนวิ่งต่อ
    const kind = !arr ? 'origin' : !dep ? 'terminal' : 'through';
    const u = R();
    let delay = u < .55 ? 0 : u < .85 ? ri(1,10) : ri(11,35);
    const tr = { no, type, T, from, to, kind, dir, stops, arrS: arr ? tm(arr) : null, depS: dep ? tm(dep) : null };
    tr.delay = delay * 60;
    if(kind === 'through'){ tr.arrA = tr.arrS + tr.delay; tr.depA = Math.max(tr.depS + tr.delay, tr.arrA + 60); }
    else if(kind === 'origin'){ tr.arrA = tr.depS - 30*60; tr.depA = tr.depS + tr.delay; }
    else { tr.arrA = tr.arrS + tr.delay; tr.depA = tr.arrA + 12*60; }
    tr.cars = T.cars + (T.freight ? ri(-2, 2) : (R() < .3 ? 1 : 0) - (R() < .2 ? 1 : 0));
    tr.len = tr.cars * 6.4;
    tr.tShow = tr.arrA - 75; tr.tHide = tr.depA + 75;
    tr.boardList = []; tr.alightList = []; tr.pOut = []; tr.pIn = [];
    return tr;
  });
  // จัดลงราง: ขบวนโดยสารใช้รางที่ 1 (ติดอาคาร) ก่อน ขบวนสินค้า/สับหลีกใช้รางที่ 2
  const free = {1:-1e9, 2:-1e9};
  [...trains].sort((a,b) => a.arrA - b.arrA).forEach(tr => {
    const pref = tr.T.freight ? [2,1] : [1,2];
    let tk = pref.find(k => free[k] <= tr.tShow - 60);
    if(!tk) tk = free[1] <= free[2] ? 1 : 2;
    tr.track = tk; free[tk] = tr.tHide;
  });
  S.trains = trains;

  let aid = 0;
  const mkAgent = (type, t, o = {}) => {
    const a = Object.assign({ id: ++aid, type, t, tIn: t, tOut: CLOSE, v: rr(1.0, 1.45), pos:null, node:null,
      plan:[], pc:0, segs:[], stepT:[], keys:[], carry:[], _arr:false }, o);
    S.agents.push(a); return a;
  };
  const streetPt = (cx) => [cx + rr(-8, 8), rr(50, 53.5)];

  // ---- ผู้โดยสารขาออก ----
  for(const tr of trains){
    if(tr.kind === 'terminal' || !tr.T.board) continue;
    const n = Math.round(tr.T.board * dayF * rr(.7, 1.25));
    for(let i = 0; i < n; i++){
      const ch = R() < .25 ? 'online' : 'counter';
      let t0 = tr.depS - (8 + Math.pow(R(), 1.5) * 60) * 60;
      if(t0 < OPEN + 60) t0 = OPEN + 60 + R()*600;
      const carI = paxCar(tr);
      const dest = pick(tr.stops);
      const span = Math.max(1, tr.stops.length);
      const f = (tr.stops.indexOf(dest) + 1) / span;
      const ag = mkAgent('dep', t0, { tr, ch, carI, dest, cls: pick(tr.T.cls), seat: ri(1, 64),
        price: Math.max(5, Math.round((tr.T.price[0] + (tr.T.price[1] - tr.T.price[0]) * f * rr(.85, 1)) / 5) * 5) });
      const shop = R() < .3;
      const defs = ag.stepDefs = ['เข้าสถานี'];
      ag.plan.push(['spawn', streetPt(52), 'street', 0], ['go','door']);
      if(ch !== 'online'){
        defs.push('ซื้อตั๋ว');
        ag.plan.push(['go','tick_in'], ['svc','ticket', { sMark:defs.length-1, onDone:(a,s,e) => {
          a.ticketNo = 'TK' + pad(++S.seq.tk, 5); a.keys.push(a.ticketNo);
          S.ev.saleCounter.push([e, a.price]); } }]);
      } else {
        ag.ticketNo = 'TK' + pad(900000 + ri(0, 99999), 6); ag.keys.push(ag.ticketNo);
      }
      if(shop){ defs.push('ร้านสะดวกซื้อ'); ag.spend = ri(15, 160);
        ag.plan.push(['go','shop_in'], ['svc','shop', { sMark:defs.length-1, onDone:(a,s,e) => S.ev.shop.push([e, a.spend]) }]); }
      const callT = tr.kind === 'origin' ? tr.depS - 20*60 : tr.arrA - 5*60;
      const iH = defs.push('ห้องพักผู้โดยสาร') - 1; defs.push('ชานชาลา','ขึ้นรถ');
      ag.plan.push(['go','hall_c'], ['sit', callT, iH], ['plat', iH+1], ['board', iH+2]);
      tr.boardList.push(ag);
    }
  }
  // ---- ผู้โดยสารขาเข้า ----
  for(const tr of trains){
    if(tr.kind === 'origin' || !tr.T.alight) continue;
    const n = Math.round(tr.T.alight * dayF * rr(.7, 1.25));
    for(let i = 0; i < n; i++){
      const carI = paxCar(tr);
      const t0 = tr.arrA + 10 + R() * Math.min(100, Math.max(20, tr.depA - tr.arrA - 10));
      const p = [carX(tr, carI) + rr(-1.5, 1.5), DOOR_Y[tr.track]];
      const ag = mkAgent('arr', t0, { tr, carI });
      ag.stepDefs = ['ลงจากรถ','ออกจากสถานี'];
      ag.plan.push(['spawn', p, null, 0]);
      if(tr.track === 2) ag.plan.push(['pt', N.p2_c, 'p2_c'], ['go','hall_n']);
      else ag.plan.push(['pt', N.hall_n, 'hall_n']);
      ag.plan.push(['go','street'], ['leave', 1]);
      tr.alightList.push(ag);
    }
  }
  // ช่วงเวลาที่คนเข้ามาใช้บริการ (มีช่วงพีคเช้า/บ่าย)
  const sampleT = (a, b) => { for(;;){ const t = rr(a, b); const h = t/3600;
      const w = .35 + Math.exp(-((h-9.5)**2)/3) + .8*Math.exp(-((h-14)**2)/4);
      if(R()*1.4 < w) return t; } };
  // ---- จองตั๋วล่วงหน้า (ใช้ช่องจำหน่ายตั๋วเดียวกัน) ----
  const pax = trains.filter(t => t.T.board && t.kind !== 'terminal');
  const nBook = Math.round(18 * dayF * rr(.8, 1.2));
  for(let i = 0; i < nBook; i++){
    const tr = pick(pax.filter(t => t.type !== 'ท้องถิ่น'));
    const travel = new Date(date); travel.setDate(travel.getDate() + ri(1, 45));
    const n = R() < .6 ? 1 : ri(2, 4);
    const ag = mkAgent('book', sampleT(7*3600, 16.5*3600), { tr, travel, pax:n, cls: pick(tr.T.cls), dest: tr.to,
      price: n * Math.round(rr(tr.T.price[1]*.5, tr.T.price[1]) / 5) * 5,
      pnr: 'BK' + Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[ri(0,31)]).join('') });
    ag.keys.push(ag.pnr);
    ag.stepDefs = ['เข้าสถานี','รับบัตรคิว','จองตั๋ว','เสร็จสิ้น'];
    ag.plan.push(['spawn', streetPt(52), 'street', 0], ['go','tick_in'],
      ['svc','ticket', { qMark:1, sMark:2, eMark:3, dur:2.4, onDone:(a,s,e) => S.ev.booking.push([e, a.price]) }], ['go','street'], ['leave']);
  }

  // ---- ลูกค้าร้านสะดวกซื้อ (คนทั่วไป) ----
  const nShop = Math.round(45 * dayF * rr(.8, 1.2));
  for(let i = 0; i < nShop; i++){
    const ag = mkAgent('shop', sampleT(5.6*3600, 19.3*3600), { spend: ri(15, 220) });
    ag.stepDefs = ['เข้าร้าน','ชำระเงิน','เสร็จสิ้น'];
    ag.plan.push(['spawn', streetPt(56), 'street', 0], ['go','shop_in'],
      ['svc','shop', { qMark:0, sMark:1, eMark:2, onDone:(a,s,e) => S.ev.shop.push([e, a.spend]) }], ['go','street'], ['leave']);
  }

  // ---- สินค้า / พัสดุ ----
  const slotFor = (t0, t1) => {
    const s0 = ri(0, S.slots.length-1);
    for(let k = 0; k < S.slots.length; k++){ const s = S.slots[(s0 + k) % S.slots.length];
      if(s.iv.every(([a,b]) => t1 <= a || t0 >= b)){ s.iv.push([t0, t1]); return s; } }
    return S.slots[s0];
  };
  const loadPath = (tr, slot) => {
    const door = [carX(tr, bagI(tr)) + rr(-1.4, 1.4), DOOR_Y[tr.track]];
    const pts = [[slot.x, slot.y], [17, 20.5], [17, 18.2], [17, 16.2]];
    if(tr.track === 2) pts.push([15, 16.2], [15, 10.2]);
    pts.push(door); return pts;
  };
  const nextLoad = {};
  const loadTime = tr => { // คิวขนสินค้าขึ้นตู้สัมภาระ (ขบวนจอดสั้น จึงขนต่อเนื่องทันทีที่รถจอด)
    const base = tr.kind === 'origin' ? tr.arrA + 300 : tr.arrA + 15;
    nextLoad[tr.no] = Math.max(nextLoad[tr.no] || base, base) + rr(4, 9);
    return nextLoad[tr.no];
  };
  const bagTrains = trains.filter(t => t.T.bag);
  let pid = 0;
  // ขาเข้า: สินค้าที่มากับขบวนรถ (และค้างรับจากวันก่อน)
  const inbound = [];
  for(let i = 0; i < 8; i++) inbound.push({ tr:null, tReady: OPEN, from: pick(PARCEL_DESTS), old:true });
  for(const tr of bagTrains){
    if(tr.kind === 'origin') continue;
    const n = ri(0, tr.type === 'ท้องถิ่น' ? 3 : 5);
    for(let i = 0; i < n; i++){
      const tU = tr.arrA + 15 + i * 9;
      inbound.push({ tr, tU, tReady: tU + 70, from: tr.from });
    }
  }
  for(const ib of inbound){
    const p = { id: ++pid, dir:'in', code: 'RCV' + pad(++S.seq.rcv, 4), from: ib.from, w: +rr(.5, 28).toFixed(1),
      tr: ib.tr, segs:[], stepT:[], fee: 0 };
    p.stepDefs = ['ฝากส่งที่ต้นทาง','ถึงสถานี','เข้าห้องเก็บ · รอรับ','ผู้รับมารับแล้ว'];
    const willPick = R() < .8;
    let tCome = willPick ? ib.tReady + rr(30, 360) * 60 : Infinity;
    if(ib.old) tCome = willPick ? sampleT(7.6*3600, 16*3600) : Infinity;
    if(tCome > 16.7*3600) tCome = Infinity;
    const slot = slotFor(ib.tReady, tCome === Infinity ? CLOSE : tCome + 3600);
    p.slot = slot;
    if(ib.tr){
      p.stepT[0] = ib.tr.arrA - rr(1, 6) * 3600; p.stepT[1] = ib.tr.arrA; p.stepT[2] = ib.tReady;
      p.segs.push({ k:'move', pts: loadPath(ib.tr, slot).reverse(), t0: ib.tU, t1: ib.tReady });
      S.ev.parcelArr.push([ib.tU, 0]); ib.tr.pIn.push(p);
    } else { p.stepT[0] = OPEN - rr(20, 40)*3600; p.stepT[1] = OPEN - rr(2, 12)*3600; p.stepT[2] = p.stepT[1] + 600; }
    p.segs.push({ k:'at', p:[slot.x, slot.y], z:0, t0: ib.tReady, t1: CLOSE + 1, slotSeg:true });
    p.tIn = p.segs[0].t0;
    p.keys = [p.code];
    S.parcels.push(p);
    if(tCome < Infinity){
      const ag = mkAgent('pick', tCome, { parcels:[p] });
      ag.stepDefs = ['เข้าสถานี','รับบัตรคิว','รับสินค้า','เสร็จสิ้น'];
      ag.plan.push(['spawn', streetPt(17), 'street', 0], ['go','goods_in'],
        ['svc','goods', { qMark:1, sMark:2, eMark:3, dur:.7, onStart:(a, s, e, srvI) => {
          const z = ZONES.goods, q = a.parcels[0]; const last = q.segs[q.segs.length-1];
          last.t1 = s; const desk = [z.srv[srvI][0], 25.55];
          const tm1 = s + Math.min(50, (e-s)*.5);
          q.segs.push({ k:'move', pts:[[q.slot.x, q.slot.y], [z.srv[srvI][0], 24.6], desk], t0:s, t1:tm1 });
          q.segs.push({ k:'at', p:desk, z:1.0, t0:tm1, t1:e });
          q.stepT[3] = e; q.tOut = e; q.picker = a; a.carry.push([e, Infinity]);
          S.ev.parcelPick.push([e, 0]);
        } }], ['go','street'], ['leave']);
      p.picker = ag;
    }
  }
  // ขาออก: ผู้มาฝากส่งสินค้า
  const nSend = Math.round(28 * dayF * rr(.8, 1.2));
  for(let i = 0; i < nSend; i++){
    const nP = R() < .65 ? 1 : ri(2, 3);
    const ag = mkAgent('send', sampleT(7.5*3600, 16.3*3600), { parcels:[], nP });
    ag.carry.push([ag.t, Infinity]);
    ag.stepDefs = ['เข้าสถานี','รับบัตรคิว','ชั่ง/ชำระค่าส่ง','เสร็จสิ้น'];
    ag.plan.push(['spawn', streetPt(17), 'street', 0], ['go','goods_in'],
      ['svc','goods', { qMark:1, sMark:2, eMark:3, dur: 1 + (nP-1)*.35, onDone:(a, s, e, srvI) => {
        a.carry[0][1] = e;
        for(let j = 0; j < a.nP; j++){
          const dest = pick(PARCEL_DESTS), w = +rr(.3, 25).toFixed(1);
          const p = { id: ++pid, dir:'out', code:'SND' + pad(++S.seq.snd, 4), dest, w, fee: Math.round(30 + w*9 + rr(0,40)),
            sender:a, segs:[], stepT:[e], tIn:e };
          p.stepDefs = ['รับฝาก','เข้าห้องเก็บ','ขนขึ้นรถ','ออกเดินทาง','ถึงปลายทาง (โดยประมาณ)'];
          p.keys = [p.code];
          const desk = [17 + (j-1)*.5, 25.55];
          const tMove = e + rr(2, 8)*60, tWh = tMove + 30;
          const tr = bagTrains.filter(t => t.kind !== 'terminal' && t.stops.includes(dest) && t.arrA + 15 >= tWh + 600)
                              .sort((x,y) => x.arrA - y.arrA)[0];
          let tLoad = tr ? loadTime(tr) : CLOSE + 1;
          if(tr && tLoad + 60 > tr.depA - 10) tLoad = Math.max(tr.arrA + 5, tr.depA - 70);
          const slot = slotFor(tWh, tLoad);
          p.segs.push({ k:'at', p:desk, z:1.0, t0:e, t1:tMove });
          p.segs.push({ k:'move', pts:[desk, [slot.x, slot.y]], t0:tMove, t1:tWh });
          p.segs.push({ k:'at', p:[slot.x, slot.y], z:0, t0:tWh, t1:tLoad });
          p.stepT[1] = tWh;
          if(tr){
            const tl1 = Math.min(tLoad + 60, tr.depA - 5);
            p.tr = tr; p.segs.push({ k:'move', pts: loadPath(tr, slot), t0:tLoad, t1:tl1 });
            p.stepT[2] = tLoad; p.stepT[3] = tr.depA; p.tLoaded = tl1;
            p.stepT[4] = tr.depA + (tr.stops.indexOf(dest) + 1) * rr(8, 14) * 60;
            p.tOut = tl1; tr.pOut.push(p);
            S.ev.parcelShip.push([tr.depA, 0]);
          }
          S.ev.parcelIn.push([e, p.fee]);
          a.parcels.push(p); S.parcels.push(p);
        }
      } }], ['go','street'], ['leave']);
  }

  // ---- จำลองคิวแบบเรียงตามเวลา ----
  const heap = new Heap();
  for(const a of S.agents) heap.push({ t: a.t, a });
  while(heap.size){ const ev = heap.pop(); runAgent(S, ev.a, ev.t, heap); }

  // ---- สรุปผล ----
  for(const tr of trains) tr.boardList.forEach(a => { if(a.boarded){ S.ev.board.push([a.tOut, 0]); if(a.ch === 'online') S.ev.online.push([a.tOut, a.price]); } });
  for(const k in S.ev){ const arr = S.ev[k].sort((a,b) => a[0]-b[0]); let s = 0;
    S.ev[k] = { t: arr.map(x => x[0]), c: arr.map(x => (s += x[1])) }; }
  S.waits.sort((a,b) => a[0]-b[0]);
  { let s = 0; S.waitT = S.waits.map(w => w[0]); S.waitC = S.waits.map(w => (s += w[1])); }
  S.agents.sort((a,b) => a.tIn - b.tIn);
  // ความหนาแน่นทั้งวัน (ทุก 5 นาที)
  const BIN = 300, nb = Math.ceil((CLOSE - OPEN) / BIN) + 1, diff = new Float64Array(nb + 1);
  for(const a of S.agents){ const i0 = clamp(Math.floor((a.tIn - OPEN)/BIN), 0, nb), i1 = clamp(Math.floor((a.tOut - OPEN)/BIN), 0, nb);
    if(i1 > i0){ diff[i0]++; diff[i1]--; } }
  S.occ = []; let c = 0; for(let i = 0; i < nb; i++){ c += diff[i]; S.occ.push(c); }
  S.occMax = Math.max(...S.occ, 1);
  return S;
}

function walkPts(a, pts, node){
  const P = [a.pos]; for(const p of pts){ const l = P[P.length-1]; if(l[0] !== p[0] || l[1] !== p[1]) P.push(p); }
  if(P.length < 2){ a.node = node; return; }
  const cum = [0]; for(let i = 1; i < P.length; i++) cum.push(cum[i-1] + dist(P[i-1], P[i]));
  const dur = cum[cum.length-1] / a.v;
  a.segs.push({ k:'walk', pts:P, cum, t0:a.t, t1:a.t + dur });
  a.t += dur; a.pos = P[P.length-1]; a.node = node;
}

function runAgent(S, a, now, heap){
  while(a.pc < a.plan.length){
    const st = a.plan[a.pc];
    switch(st[0]){
      case 'spawn': a.pos = st[1]; a.node = st[2]; if(st[3] !== undefined) a.stepT[st[3]] = a.t; break;
      case 'go': walkPts(a, a.node ? route(a.node, st[1]) : [N[st[1]]], st[1]); break;
      case 'pt': walkPts(a, [st[1]], st[2]); break;
      case 'svc': {
        if(!a._arr){ a._arr = true; if(a.t > now + 1e-6){ heap.push({ t:a.t, a }); return; } }
        a._arr = false;
        const zk = st[1], z = ZONES[zk], o = st[2] || {}, F = S.srv[zk];
        const nAct = Math.max(1, Math.min(F.length, z.nAt(a.t)));
        let bi = 0; for(let i = 1; i < nAct; i++) if(F[i] < F[bi]) bi = i;
        const start = Math.max(a.t, F[bi], z.open);
        const end = start + rr(z.dur[0], z.dur[1]) * (o.dur || 1);
        F[bi] = end;
        if(z.prefix){ S.qn[zk] = (S.qn[zk] || 0) + 1; a.q = z.prefix + pad(S.qn[zk], 3); a.keys.push(a.q); }
        a.segs.push({ k:'queue', z:zk, t0:a.t, t1:start }, { k:'serve', z:zk, s:bi, t0:start, t1:end });
        S.waits.push([start, (start - a.t) / 60, zk]);
        if(o.qMark !== undefined) a.stepT[o.qMark] = a.t;
        if(o.sMark !== undefined) a.stepT[o.sMark] = start;
        if(o.eMark !== undefined) a.stepT[o.eMark] = end;
        if(o.onStart) o.onStart(a, start, end, bi);
        if(o.onDone) o.onDone(a, start, end, bi);
        a.t = end; a.pos = z.srv[bi]; a.node = z.entry;
        break;
      }
      case 'sit': { // นั่งรอในห้องพัก/ม้านั่งชานชาลาจนถึงเวลาเรียกขึ้นรถ
        const until = st[1]; a.stepT[st[2]] = a.t;
        if(a.t < until - 90){
          const s0 = ri(0, S.seats.length-1); let seat = null;
          for(let k = 0; k < S.seats.length; k++){ const s = S.seats[(s0+k) % S.seats.length];
            if(s.iv.every(([x,y]) => until + 20 <= x || a.t >= y)){ seat = s; break; } }
          const p = seat ? [seat.x, seat.y] : [rr(46, 59.5), pick([22.6, 25.8, 29]) + rr(-.3, .3)];
          walkPts(a, [p], null);
          const t1 = Math.max(until, a.t + 30);
          if(seat) seat.iv.push([a.t, t1 + 20]);
          a.segs.push({ k: seat ? 'sit' : 'stand', area: seat ? seat.area : 'hall', p, t0:a.t, t1 });
          a.t = t1;
        }
        break;
      }
      case 'plat': {
        const tr = a.tr, pl = tr.track; a.stepT[st[1]] = a.t;
        if(a.t > tr.depA - 15){ // ตกขบวน
          a.missed = true; a.stepDefs = a.stepDefs.slice(0, st[1]+1).concat(['ตกขบวน · ออกจากสถานี']);
          a.plan.splice(a.pc + 1, a.plan.length, ['pt', N.hall_n, 'hall_n'], ['go','street'], ['leave', st[1]+1]);
          break;
        }
        if(pl === 2) walkPts(a, [N.p1_c, N.p2_c], 'p2_c');
        const cx = carX(tr, a.carI);
        const p = [clamp(cx + rr(-3.5, 3.5), 2, 72), rr(PLAT_Y[pl][0], PLAT_Y[pl][1])];
        walkPts(a, [p], null);
        let tb = tr.kind === 'origin' ? Math.max(a.t + rr(20, 240), tr.arrA + 120) : Math.max(a.t + 8, tr.arrA + 15 + R() * Math.max(20, tr.depA - tr.arrA - 40));
        tb = Math.min(tb, tr.depA - 12);
        if(tb > a.t) a.segs.push({ k:'stand', area: 'plat' + pl, p, t0:a.t, t1:tb });
        a.t = Math.max(a.t, tb);
        break;
      }
      case 'board': {
        walkPts(a, [[carX(a.tr, a.carI) + rr(-1.6, 1.6), DOOR_Y[a.tr.track]]], null);
        a.stepT[st[1]] = a.t; a.tOut = a.t; a.boarded = true;
        break;
      }
      case 'leave': {
        walkPts(a, [[a.pos[0] + rr(-10, 10), 56]], null);
        a.tOut = a.t; if(st[1] !== undefined) a.stepT[st[1]] = a.t;
        break;
      }
    }
    a.pc++;
  }
  if(a.tOut === CLOSE) a.tOut = a.t;
}

/* ---------------- สถานะ ณ เวลา t ---------------- */
let T = 8*3600, speed = 60, playing = true, live = false, mode = 'type';
let sel = null;   // {kind:'agent'|'parcel'|'train', obj}
const segAt = (o, t) => { const s = o.segs; let i = o._si || 0; if(i >= s.length) i = s.length - 1;
  while(i > 0 && s[i].t0 > t) i--; while(i < s.length-1 && s[i].t1 <= t) i++; o._si = i; return s[i]; };
function walkPos(sg, t){
  const d = (t - sg.t0) / Math.max(1e-6, sg.t1 - sg.t0) * sg.cum[sg.cum.length-1];
  let i = 1; while(i < sg.cum.length-1 && sg.cum[i] < d) i++;
  const a = sg.pts[i-1], b = sg.pts[i], f = clamp((d - sg.cum[i-1]) / Math.max(1e-6, sg.cum[i] - sg.cum[i-1]), 0, 1);
  return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f];
}
function qSlot(z, k, a){
  const q = z.queue, sp = .8;
  const cols = Math.max(1, Math.floor((q.x1 - q.x0) / sp) + 1), rows = Math.max(1, Math.floor(Math.abs(q.yF - q.yN) / sp) + 1);
  if(q.v){ // แถวคิวตามแนวตั้ง (ช่องตั๋วอยู่บนผนังด้านข้าง)
    const c2 = Math.max(1, Math.floor((q.y1 - q.y0) / sp) + 1), r2 = Math.max(1, Math.floor(Math.abs(q.xF - q.xN) / sp) + 1);
    const kk = Math.min(k, c2 * r2 - 1), row = Math.floor(kk / c2); let col = kk % c2; if(row % 2) col = c2 - 1 - col;
    return [q.xN + Math.sign(q.xF - q.xN) * row * sp, q.y0 + col * sp + (q.y1 - q.y0 - (c2-1)*sp)/2];
  }
  if(k >= cols * rows){ const e = N[z.entry]; const h = (a.id * 9301 + 49297) % 233280 / 233280;
    return [e[0] + (h - .5) * 7, e[1] + ((a.id * 7) % 10 / 10 - .5) * 2.2 + (z.entry === 'p1_e' ? -.6 : -2.2)]; }
  const row = Math.floor(k / cols); let col = k % cols; if(row % 2) col = cols - 1 - col;
  return [q.x0 + col * sp + (q.x1 - q.x0 - (cols-1)*sp)/2, q.yN + Math.sign(q.yF - q.yN) * row * sp];
}
function trainOffset(tr, t){
  if(t < tr.tShow || t > tr.tHide) return null;
  const e = x => 1 - Math.pow(1 - x, 3);
  if(t < tr.arrA){ const f = e((t - tr.tShow) / (tr.arrA - tr.tShow)); return -tr.dir * (1 - f) * 120; }
  if(t > tr.depA){ const f = (t - tr.depA) / (tr.tHide - tr.depA); return tr.dir * f * f * 130; }
  return 0;
}
function trainStatus(tr, t){
  if(t >= tr.depA){ return tr.kind === 'terminal' ? ['เข้าโรงรถแล้ว','mut'] : ['ออกแล้ว ' + hhmm(tr.depA),'mut']; }
  if(t >= tr.arrA){ return tr.kind === 'terminal' ? ['ถึงแล้ว · ชานชาลา ' + tr.track,'live'] : ['จอดชานชาลา ' + tr.track,'live']; }
  if(t >= tr.arrA - 90) return [tr.kind === 'origin' ? 'กำลังเทียบชานชาลา' : 'กำลังเข้าสถานี','live'];
  if(tr.delay >= 10*60) return ['ล่าช้า ' + Math.round(tr.delay/60) + ' น.','bad'];
  if(tr.delay > 0) return ['ล่าช้า ' + Math.round(tr.delay/60) + ' น.','warn'];
  return ['ตรงเวลา','ok'];
}
const trTime = tr => tr.kind === 'terminal' ? tr.arrS : tr.depS;
const trName = tr => `${tr.from} → ${tr.kind === 'terminal' ? STATION.here : tr.to}`;
const cumAt = (e, t) => { let lo = 0, hi = e.t.length; while(lo < hi){ const m = (lo+hi) >> 1; if(e.t[m] <= t) lo = m+1; else hi = m; }
  return { n: lo, sum: lo ? e.c[lo-1] : 0 }; };
const bsearch = (arr, t) => { let lo = 0, hi = arr.length; while(lo < hi){ const m = (lo+hi) >> 1; if(arr[m] <= t) lo = m+1; else hi = m; } return lo; };

// คำนวณสถานะทุกคน ณ เวลาปัจจุบัน (ใช้ทั้งวาดภาพและแผงข้อมูล)
let frame = null;
function computeFrame(t){
  const F = { t, people:[], parcels:[], zoneQ:{}, zoneS:{}, area:{hall:0, plat1:0, plat2:0, store:0}, waiting:0 };
  for(const k in ZONES){ F.zoneQ[k] = []; F.zoneS[k] = 0; }
  const A = sim.agents;
  for(let i = 0; i < A.length; i++){
    const a = A[i]; if(a.tIn > t) break; if(a.tOut <= t) continue;
    const sg = segAt(a, t); if(!sg || sg.t0 > t) continue;
    let p = null, st = 'walk';
    if(sg.k === 'walk') p = walkPos(sg, t);
    else if(sg.k === 'queue'){ F.zoneQ[sg.z].push(a); st = 'queue'; }
    else if(sg.k === 'serve'){ p = ZONES[sg.z].srv[sg.s]; F.zoneS[sg.z]++; st = 'serve'; }
    else { p = sg.p; st = sg.k; if(sg.area) F.area[sg.area]++; }
    F.people.push({ a, sg, p, st });
  }

function statusOf(a, t){
  if(t < a.tIn) return 'ยังไม่ถึงสถานี';
  if(t >= a.tOut){ if(a.boarded) return t >= a.tr.depA ? 'ออกเดินทางแล้ว' : 'ขึ้นรถแล้ว'; return a.missed ? 'ตกขบวน · ออกแล้ว' : 'ออกจากสถานีแล้ว'; }
  const sg = segAt(a, t);
  if(sg.k === 'queue') return ZONES[sg.z].wait;
  if(sg.k === 'serve') return sg.z === 'goods' && a.type === 'pick' ? 'กำลังรับสินค้า' : sg.z === 'ticket' && a.type === 'book' ? 'กำลังจองตั๋ว' : ZONES[sg.z].now;
  if(sg.k === 'sit') return 'นั่งรอขบวน';
  if(sg.k === 'stand') return sg.area === 'hall' ? 'ยืนรอในห้องพัก' : 'รอขึ้นรถ';
  if(a.type === 'arr' && !a.stepT[1]) return 'ลงจากรถ';
  if(a.type === 'arr' || (a.stepT[a.stepDefs.length-1] === undefined && t > (a.stepT[a.stepDefs.length-2] || 1e9))) return 'กำลังออกจากสถานี';
  return 'กำลังเดิน';
}
function parcelStatus(p, t){
  if(p.dir === 'out'){
    if(t < p.stepT[0]) return 'ยังไม่รับฝาก';
    if(p.tr && t >= p.tr.depA) return 'ออกเดินทางแล้ว';
    if(p.stepT[2] !== undefined && t >= p.stepT[2]) return t >= p.tLoaded ? 'อยู่บนตู้สัมภาระ' : 'กำลังขนขึ้นรถ';
    if(t >= p.stepT[1]) return p.tr ? 'อยู่ในคลัง · รอขบวน ' + p.tr.no : 'อยู่ในคลัง · รอขบวนวันถัดไป';
    return 'รอนำเข้าคลัง';
  }
  if(t < (p.stepT[1] || 0)) return 'กำลังเดินทางมา';
  if(p.stepT[3] !== undefined && t >= p.stepT[3]) return 'ผู้รับมารับแล้ว';
  if(t < p.stepT[2]) return 'กำลังขนลงจากรถ';

  const x = (T - OPEN) / (CLOSE - OPEN) * w; g.strokeStyle = 'rgba(29,43,42,.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
  g.fillStyle = '#6b7b79'; g.font = '11px Chakra Petch'; g.textBaseline = 'top';
  for(let hr = Math.ceil(OPEN/3600) + 1; hr < CLOSE/3600; hr += 3){ const xx = (hr*3600 - OPEN) / (CLOSE - OPEN) * w; g.fillText(pad(hr) + ':00', xx - 14, 0); }
}
function renderLegend(){
  $('#legend').innerHTML = mode === 'wait'
    ? [['#2f9e5b','รอ < 5 น.'],['#e0a21b','5–15 น.'],['#d64541','> 15 น.']].map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')
    : [['dep','ขาออก'],['arr','ขาเข้า'],['book','จองตั๋ว'],['send','ส่งสินค้า'],['pick','รับสินค้า'],['shop','ร้านค้า']].map(([k, t]) => `<span><i style="background:${COLORS[k]}"></i>${t}</span>`).join('')
      + '<span><i style="background:#2c4a63"></i>จนท.</span>';
}

/* ---------------- ควบคุม ---------------- */
function loadDate(d, t){
  sim = buildDay(d); SEATS = seatItems();
  T = clamp(t, OPEN, CLOSE); snapAll = true; sel = null;
  $('#dD').value = d.getDate(); $('#dM').value = d.getMonth(); $('#dY').value = d.getFullYear();
  const pax = sim.agents.filter(a => a.type === 'dep' || a.type === 'arr').length;
  $('#ftxt').textContent = `ผู้โดยสาร ${fmtN(pax)} ราย · ผู้ใช้บริการอื่น ${fmtN(sim.agents.length - pax)} ราย · สินค้า ${fmtN(sim.parcels.length)} ชิ้น · ข้อมูลจำลอง`;
  frame = computeFrame(T); drawSpark(); renderPanels(); renderClock();
}
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function nowSec(){ const n = new Date(); return n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds() + n.getMilliseconds()/1000; }
function goLive(){ live = true; playing = true; speed = 1; const d = today();
  if(!sim || sim.date.getTime() !== d.getTime()) loadDate(d, nowSec()); else { T = clamp(nowSec(), OPEN, CLOSE); snapAll = true; } renderClock(); }
function fillDateSelects(){
  const y0 = new Date().getFullYear();
  $('#dD').innerHTML = Array.from({length:31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');
  $('#dM').innerHTML = TH_M.map((m, i) => `<option value="${i}">${m}</option>`).join('');
  $('#dY').innerHTML = [y0-2, y0-1, y0, y0+1].map(y => `<option value="${y}">${y+543}</option>`).join('');
}
function selDate(){ const y = +$('#dY').value, m = +$('#dM').value; const dd = Math.min(+$('#dD').value, new Date(y, m+1, 0).getDate()); return new Date(y, m, dd); }

fillDateSelects();
$('#stName').textContent = STATION.name; $('#stSub').textContent = STATION.sub;
$('#bOpen').onclick = () => { live = false; loadDate(selDate(), 7*3600); playing = true; renderClock(); };
$('#bYest').onclick = () => { live = false; const d = new Date(sim.date); d.setDate(d.getDate() - 1); loadDate(d, T); renderClock(); };
$('#bLive').onclick = goLive;
$('#play').onclick = () => { if(live){ live = false; } playing = !playing; if(T >= CLOSE){ T = OPEN; snapAll = true; } renderClock(); };
document.querySelectorAll('#speeds [data-sp]').forEach(b => b.onclick = () => { live = false; speed = +b.dataset.sp; playing = true; renderClock(); });
$('#slider').oninput = e => { live = false; T = OPEN + (CLOSE - OPEN) * e.target.value / 1000; snapAll = true; frame = computeFrame(T); renderPanels(); renderClock(); drawSpark(); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  mode = b.dataset.mode === 'type2' ? 'type' : b.dataset.mode; renderLegend(); });
$('#btnPanels').onclick = () => $('#right').classList.toggle('open');
$('#bMin').onclick = () => { const m = $('#left').classList.toggle('min'); $('#bMin').textContent = m ? 'แสดงตัวควบคุม' : 'ย่อแผง'; if(W <= 900) homeView(); drawSpark(); };
if(innerWidth <= 520){ $('#left').classList.add('min'); $('#bMin').textContent = 'แสดงตัวควบคุม'; }
$('#zIn').onclick = () => zoomAt(W/2, Hh/2, 1.3); $('#zOut').onclick = () => zoomAt(W/2, Hh/2, 1/1.3);
$('#rL').onclick = () => rotateBy(-1); $('#rR').onclick = () => rotateBy(1); $('#home').onclick = () => homeView();
function rotateBy(d){ const c = screenToWorld(W/2, Hh/2); cam.rot = (cam.rot + d + 4) % 4; const s = P(c[0], c[1]); cam.px += W/2 - s[0]; cam.py += Hh/2 - s[1]; snapAll = true; }
function zoomAt(sx, sy, f){ const ns = clamp(cam.s * f, 3, 60); const k = ns / cam.s;
  cam.px = sx - W/2 - (sx - W/2 - cam.px) * k; cam.py = sy - Hh/2 - (sy - Hh/2 - cam.py) * k; cam.s = ns; }
function focusWorld(x, y){ const s = P(x, y); cam.px += W/2 - s[0]; cam.py += Hh/2 - s[1]; }

document.addEventListener('click', e => {
  if(e.target.closest('[data-close]')){ sel = null; renderDetail(); return; }
  const z = e.target.closest('[data-zone]'); if(z){ const Z = ZONES[z.dataset.zone]; focusWorld(Z.label[0], Z.label[1]); if(cam.s < 12) zoomAt(W/2, Hh/2, 12 / cam.s); return; }
  const tr = e.target.closest('[data-train]'); if(tr){ sel = { kind:'train', obj: sim.trains.find(x => x.no === tr.dataset.train) }; renderDetail(); return; }
  const pc = e.target.closest('[data-parcel]'); if(pc){ sel = { kind:'parcel', obj: sim.parcels.find(x => x.id === +pc.dataset.parcel) }; renderDetail(); }
});

// ค้นหา
$('#q').addEventListener('keydown', e => { if(e.key !== 'Enter') return; doSearch(e.target.value.trim()); });
function doSearch(s){
  const hint = $('#qhint'); hint.textContent = ''; if(!s) return;
  const n = norm(s.replace(/^ขบวน/, ''));
  const ag = sim.agents.find(a => a.keys.some(k => norm(k) === n));
  if(ag){ sel = { kind:'agent', obj: ag }; if(T < ag.tIn && !live){ T = ag.tIn + 1; snapAll = true; }
    frame = computeFrame(T); const o = frame.people.find(x => x.a === ag); if(o) focusWorld(o.p[0], o.p[1]); renderPanels(); return; }
  const p = sim.parcels.find(q => norm(q.code) === n); if(p){ sel = { kind:'parcel', obj:p }; renderDetail(); return; }
  const tr = sim.trains.find(x => x.no === n); if(tr){ sel = { kind:'train', obj:tr }; renderDetail(); return; }
  hint.textContent = 'ไม่พบข้อมูล';
}

// ลาก / ซูม / คลิกบนแผนที่
const ptrs = new Map(); let dragMoved = 0, pinch0 = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); dragMoved = 0; cv.classList.add('drag');
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch0 = { d: dist(a, b), s: cam.s }; } });
cv.addEventListener('pointermove', e => { if(!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); const cur = [e.clientX, e.clientY];
  if(ptrs.size === 1){ cam.px += cur[0] - prev[0]; cam.py += cur[1] - prev[1]; dragMoved += Math.abs(cur[0]-prev[0]) + Math.abs(cur[1]-prev[1]); }
  ptrs.set(e.pointerId, cur);
  if(ptrs.size === 2 && pinch0){ const [a, b] = [...ptrs.values()]; const m = [(a[0]+b[0])/2, (a[1]+b[1])/2]; zoomAt(m[0], m[1], pinch0.s * dist(a, b) / pinch0.d / cam.s); dragMoved = 99; } });
const pUp = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch0 = null; if(!ptrs.size) cv.classList.remove('drag'); };
cv.addEventListener('pointerup', e => { pUp(e); if(dragMoved < 6) pickAt(e.clientX, e.clientY); });
cv.addEventListener('pointercancel', pUp);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); }, { passive:false });
function pickAt(x, y){
  for(const l of labelHits) if(x >= l.x && x <= l.x + l.w && y >= l.y && y <= l.y + l.h){
    if(l.train){ sel = { kind:'train', obj:l.train }; renderDetail(); return; } }
  let best = null, bd = 1e9;
  for(const h of hits){ const d = Math.hypot(h.x - x, h.y - y); if(d < h.r && d < bd){ bd = d; best = h; } }
  if(best){ sel = best.o.parcel ? { kind:'parcel', obj: best.o.parcel } : { kind:'agent', obj: best.o.a }; renderDetail(); return; }
  // คลิกโดนขบวนรถ
  const w = screenToWorld(x, y);
  for(const tr of sim.trains){ const off = trainOffset(tr, T); if(off === null) continue;
    if(Math.abs(w[1] - TRACK_Y[tr.track]) < 2.5 && w[0] > X0 + off && w[0] < X0 + tr.len + off){ sel = { kind:'train', obj:tr }; renderDetail(); return; } }
  sel = null; renderDetail();
}

// ลูปหลัก
let last = performance.now(), uiAcc = 0;
function tick(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if(live){ const d = today(); if(d.getTime() !== sim.date.getTime()) loadDate(d, nowSec()); T = clamp(nowSec(), OPEN, CLOSE); }
  else if(playing){ T += dt * speed; if(T >= CLOSE){ T = CLOSE; playing = false; } }
  frame = computeFrame(T);
  render(dt);
  uiAcc += dt; if(uiAcc > .25){ uiAcc = 0; renderPanels(); renderClock(); drawSpark(); }
  requestAnimationFrame(tick);
}
addEventListener('resize', () => { resize(); drawSpark(); });
resize(); homeView(); renderLegend();
loadDate(today(), 6.9*3600);
requestAnimationFrame(tick);
</script>
